name: Docker React CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t david/docker-react-test -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true david/docker-react-test npm run test -- --coverage

  deploy:
    runs-on: ubuntu-latest

    needs: test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Create deployment package
        run: zip -r deploy.zip Dockerfile build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-2"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy.zip \
            s3://elasticbeanstalk-us-east-2-688567283539/frontend/deploy-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "frontend" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-us-east-2-688567283539",S3Key="frontend/deploy-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "Frontend-env" \
            --version-label "${{ github.sha }}"

